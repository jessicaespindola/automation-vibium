<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow DOM</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="index.html">Peças <span>&amp;</span> Prova</a>
    <p class="selo">Unidade VAR-347</p>
  </header>
  <nav class="abas" aria-label="Laboratórios">
    <a href="formulario.html">Formulário</a>
    <a href="acessivel.html">Leitura</a>
    <a href="espera.html">Espera</a>
    <a href="midia.html">Emulação</a>
    <a href="dialogo.html" aria-current="page">Bordas</a>
    <a href="relogio.html">Relógio</a>
    <a href="loja.html">Loja</a>
  </nav>
  <main>
    <section class="painel">
      <h1>Componente com shadow root aberto</h1>
      <p class="lead">O miolo vive dentro da sombra e ainda assim dá para ler.</p>
      <my-card></my-card>
    </section>
  </main>
  <script>
    customElements.define("my-card", class extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = `
          <style>
            p {
              margin: 0;
              padding: 0.85rem 1rem;
              border-radius: 14px;
              background: #f6d7bf;
              color: #143d4f;
              font: 650 1rem "Segoe UI", sans-serif;
            }
          </style>
          <p id="miolo">texto na sombra</p>`;
      }
    });
  </script>
</body>
</html>
