<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diálogos</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="index.html">Peças <span>&amp;</span> Prova</a>
    <p class="selo">Unidade VAR-347</p>
  </header>
  <nav class="abas" aria-label="Laboratórios">
    <a href="formulario.html">Formulário</a>
    <a href="acessivel.html">Leitura</a>
    <a href="espera.html">Espera</a>
    <a href="midia.html">Emulação</a>
    <a href="dialogo.html" aria-current="page">Bordas</a>
    <a href="relogio.html">Relógio</a>
    <a href="loja.html">Loja</a>
  </nav>
  <main>
    <section class="painel">
      <h1>Diálogos</h1>
      <p class="lead">Cada botão abre um diálogo do navegador e devolve o resultado na faixa abaixo.</p>
      <div class="acoes">
        <button type="button" data-testid="alerta">Reservar</button>
        <button type="button" data-testid="confirma">Confirmar pedido</button>
        <button type="button" data-testid="pergunta">Informar baia</button>
        <p class="eco" data-testid="eco"></p>
      </div>
    </section>
  </main>
  <script>
    const eco = document.querySelector("[data-testid=eco]");
    function publicar(texto) {
      eco.textContent = texto;
      eco.dataset.tom = texto ? "ok" : "";
    }
    document.querySelector("[data-testid=alerta]").addEventListener("click", () => {
      alert("peca reservada");
      publicar("alerta-ok");
    });
    document.querySelector("[data-testid=confirma]").addEventListener("click", () => {
      publicar(confirm("confirmar pedido?") ? "confirmado" : "cancelado");
    });
    document.querySelector("[data-testid=pergunta]").addEventListener("click", () => {
      publicar(prompt("service bay", "") || "");
    });
  </script>
</body>
</html>
