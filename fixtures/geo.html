<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geolocalização</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="index.html">Peças <span>&amp;</span> Prova</a>
    <p class="selo">Unidade VAR-347</p>
  </header>
  <nav class="abas" aria-label="Laboratórios">
    <a href="formulario.html">Formulário</a>
    <a href="acessivel.html">Leitura</a>
    <a href="espera.html">Espera</a>
    <a href="midia.html" aria-current="page">Emulação</a>
    <a href="dialogo.html">Bordas</a>
    <a href="relogio.html">Relógio</a>
    <a href="loja.html">Loja</a>
  </nav>
  <main>
    <section class="painel">
      <h1>Baia em campo</h1>
      <p class="lead">A leitura pede a posição. Se o navegador negar, a faixa mostra o erro.</p>
      <button type="button" data-testid="ler">Ler coordenadas</button>
      <p class="eco" data-testid="lat"></p>
    </section>
  </main>
  <script>
    document.querySelector("[data-testid=ler]").addEventListener("click", () => {
      const faixa = document.querySelector("[data-testid=lat]");
      navigator.geolocation.getCurrentPosition(
        (position) => {
          faixa.textContent = position.coords.latitude.toFixed(2);
          faixa.dataset.tom = "ok";
        },
        (error) => {
          faixa.textContent = "erro " + error.message;
          faixa.dataset.tom = "";
        }
      );
    });
  </script>
</body>
</html>
