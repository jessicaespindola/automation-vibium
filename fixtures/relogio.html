<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relógio</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="index.html">Peças <span>&amp;</span> Prova</a>
    <p class="selo">Unidade VAR-347</p>
  </header>
  <nav class="abas" aria-label="Laboratórios">
    <a href="formulario.html">Formulário</a>
    <a href="acessivel.html">Leitura</a>
    <a href="espera.html">Espera</a>
    <a href="midia.html">Emulação</a>
    <a href="dialogo.html">Bordas</a>
    <a href="relogio.html" aria-current="page">Relógio</a>
    <a href="loja.html">Loja</a>
  </nav>
  <main>
    <section class="painel">
      <h1>Temporizador</h1>
      <p class="lead">O sinal só muda depois dos cinco segundos do relógio da página.</p>
      <div class="acoes">
        <button type="button" data-testid="armar">Armar 5s</button>
        <p class="estado" data-testid="estado" data-tom="espera">aguardando</p>
      </div>
    </section>
  </main>
  <script>
    document.querySelector("[data-testid=armar]").addEventListener("click", () => {
      setTimeout(() => {
        const estado = document.querySelector("[data-testid=estado]");
        estado.textContent = "disparou";
        estado.dataset.tom = "ok";
      }, 5000);
    });
  </script>
</body>
</html>
